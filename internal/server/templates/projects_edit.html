{{define "content"}}
<div class="card" style="max-width: 600px; margin: 2rem auto;">
    <h2>Edit Project</h2>
    {{if .Error}}
        <div style="color: red; margin-bottom: 1rem;">{{.Error}}</div>
    {{end}}
    <form action="/projects/edit" method="POST">
        <label for="title">Project Title</label>
        <input type="text" id="title" name="title" value="{{.Project.Title}}" required>
        
        <label for="summary">Summary</label>
        <textarea id="summary" name="summary" rows="4" required>{{.Project.Summary}}</textarea>
        
        <label for="repo_url">Repository URL</label>
        <input type="url" id="repo_url" name="repo_url" value="{{.Project.RepoURL}}" required>
        
        <label for="track_id">Track</label>
        <select id="track_id" name="track_id" required>
            {{range .Tracks}}
            <option value="{{.ID}}" {{if eq .ID $.Project.TrackID}}selected{{end}}>{{.Name}}</option>
            {{end}}
        </select>
        
        <button type="submit" style="width: 100%;">Save Changes</button>
    </form>
</div>
{{end}}
