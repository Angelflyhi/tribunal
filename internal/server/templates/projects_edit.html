{{define "content"}}
<div class="card" style="max-width: 800px; margin: 2rem auto;">
    <h2>Edit Project</h2>
    <p style="color: var(--text-muted); margin-bottom: 2rem;">Update your project details below.</p>
    
    {{if .Error}}
        <div style="color: #ef4444; background: rgba(239, 68, 68, 0.1); padding: 1rem; border-radius: var(--radius-sm); margin-bottom: 1rem; border: 1px solid #ef4444;">{{.Error}}</div>
    {{end}}
    
    <form action="/projects/edit" method="POST" style="display: flex; flex-direction: column; gap: 1.5rem;">
        <div>
            <label for="title">Project Title *</label>
            <input type="text" id="title" name="title" value="{{.Project.Title}}" required style="width: 100%;">
        </div>
        
        <div>
            <label for="tagline">Tagline</label>
            <input type="text" id="tagline" name="tagline" value="{{.Project.Tagline}}" placeholder="A catchy one-liner describing your project" style="width: 100%;">
        </div>
        
        <div>
            <label for="summary">Short Summary *</label>
            <textarea id="summary" name="summary" rows="3" required style="width: 100%;">{{.Project.Summary}}</textarea>
        </div>
        
        <div>
            <label for="long_description">Long Description</label>
            <textarea id="long_description" name="long_description" rows="8" style="width: 100%; font-family: var(--font-mono); font-size: 0.9rem;">{{.Project.LongDescription}}</textarea>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
            <div>
                <label for="track_id">Track *</label>
                <select id="track_id" name="track_id" required style="width: 100%;">
                    {{range .Tracks}}
                    <option value="{{.ID}}" {{if eq .ID $.Project.TrackID}}selected{{end}}>{{.Name}}</option>
                    {{end}}
                </select>
            </div>
            <div>
                <label for="tech_tags">Technology Tags</label>
                <input type="text" id="tech_tags" name="tech_tags" value="{{.Project.TechTags}}" placeholder="React, Go, SQLite, AI" style="width: 100%;">
            </div>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
            <div>
                <label for="thumbnail">Thumbnail Image URL</label>
                <input type="url" id="thumbnail" name="thumbnail" value="{{.Project.Thumbnail}}" placeholder="https://example.com/image.png" style="width: 100%;">
            </div>
            <div>
                <label for="image_gallery">Image Gallery URLs</label>
                <input type="text" id="image_gallery" name="image_gallery" value="{{.Project.ImageGallery}}" placeholder="Comma-separated image URLs" style="width: 100%;">
            </div>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.5rem;">
            <div>
                <label for="repo_url">Repository URL *</label>
                <input type="url" id="repo_url" name="repo_url" value="{{.Project.RepoURL}}" required style="width: 100%;">
            </div>
            <div>
                <label for="demo_url">Demo Video URL</label>
                <input type="url" id="demo_url" name="demo_url" value="{{.Project.DemoURL}}" style="width: 100%;">
            </div>
            <div>
                <label for="live_link">Live Project Link</label>
                <input type="url" id="live_link" name="live_link" value="{{.Project.LiveLink}}" style="width: 100%;">
            </div>
        </div>
        
        <div>
            <label for="status">Submission Status</label>
            <select id="status" name="status" style="width: 100%;">
                <option value="draft" {{if eq .Project.Status "draft"}}selected{{end}}>Draft (Not visible to judges yet)</option>
                <option value="submitted" {{if eq .Project.Status "submitted"}}selected{{end}}>Final Submission (Ready for judging)</option>
            </select>
        </div>
        
        <div style="margin-top: 1rem; display: flex; gap: 1rem;">
            <button type="submit" class="btn-primary" style="flex: 1; padding: 1rem; font-size: 1.1rem;">Save Changes</button>
            <a href="/dashboard" class="btn-secondary" style="flex: 1; text-align: center; padding: 1rem; font-size: 1.1rem; line-height: 1.5;">Cancel</a>
        </div>
    </form>
</div>
{{end}}
