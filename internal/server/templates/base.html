{{define "base"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tribunal · Dogfood 2026</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="loader" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg-base); z-index: 9999; display: flex; justify-content: center; align-items: center; transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);">
        <svg width="450" height="100" viewBox="0 0 450 100">
            <!-- T -->
            <rect x="10" y="20" width="40" height="10" fill="var(--text-primary)" class="shape"/>
            <rect x="25" y="20" width="10" height="50" fill="var(--text-primary)" class="shape"/>
            <!-- R -->
            <rect x="70" y="20" width="10" height="50" fill="var(--text-primary)" class="shape"/>
            <path d="M 70 20 h 20 a 15 15 0 0 1 0 30 h -20" fill="none" stroke="var(--text-primary)" stroke-width="10" class="shape"/>
            <path d="M 85 50 l 15 20" fill="none" stroke="var(--text-primary)" stroke-width="10" class="shape"/>
            <!-- I -->
            <rect x="125" y="20" width="10" height="50" fill="var(--text-primary)" class="shape"/>
            <!-- B -->
            <rect x="155" y="20" width="10" height="50" fill="var(--text-primary)" class="shape"/>
            <path d="M 155 20 h 15 a 12.5 12.5 0 0 1 0 25 h -15" fill="none" stroke="var(--text-primary)" stroke-width="10" class="shape"/>
            <path d="M 155 45 h 15 a 12.5 12.5 0 0 1 0 25 h -15" fill="none" stroke="var(--text-primary)" stroke-width="10" class="shape"/>
            <!-- U -->
            <path d="M 210 20 v 35 a 15 15 0 0 0 30 0 v -35" fill="none" stroke="var(--text-primary)" stroke-width="10" class="shape"/>
            <!-- N -->
            <rect x="265" y="20" width="10" height="50" fill="var(--text-primary)" class="shape"/>
            <path d="M 270 20 l 25 50" fill="none" stroke="var(--text-primary)" stroke-width="10" class="shape"/>
            <rect x="290" y="20" width="10" height="50" fill="var(--text-primary)" class="shape"/>
            <!-- A -->
            <path d="M 325 70 l 15 -50 l 15 50" fill="none" stroke="var(--text-primary)" stroke-width="10" stroke-linejoin="miter" class="shape"/>
            <rect x="330" y="50" width="20" height="10" fill="var(--text-primary)" class="shape"/>
            <!-- L -->
            <rect x="375" y="20" width="10" height="50" fill="var(--text-primary)" class="shape"/>
            <rect x="375" y="60" width="30" height="10" fill="var(--text-primary)" class="shape"/>
        </svg>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const shapes = document.querySelectorAll('.shape');
            shapes.forEach((shape, i) => {
                shape.style.opacity = '0';
                shape.style.transform = 'translateY(20px)';
                shape.style.transition = `all 0.6s cubic-bezier(0.16, 1, 0.3, 1) ${i * 0.05}s`;
                
                requestAnimationFrame(() => {
                    shape.style.opacity = '1';
                    shape.style.transform = 'translateY(0)';
                });
            });

            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                loader.style.transform = 'scale(1.05)';
                loader.style.pointerEvents = 'none';
                setTimeout(() => loader.remove(), 800);
            }, 1200);
        });
    </script>
    <nav>
        <div class="brand"><a href="/projects"><img src="https://cdn.prod.website-files.com/65de32a4db6b43b048630aef/65e205d14e76ead77edab322_5038912.png" alt="Raptors Logo" style="height: 24px; filter: grayscale(100%) contrast(1.2);"> Tribunal</a></div>
        <div class="nav-links">
            <a href="/projects">Gallery</a>
            {{if .User}}
                <a href="/dashboard">Dashboard</a>
                {{if eq .User.Role "participant"}}
                    <a href="/projects/new">Submit Project</a>
                {{end}}
                <span class="badge role-{{.User.Role}}">
                    👤 {{.User.Email}} ({{.User.Role}})
                </span>
                <a href="/logout" class="btn btn-secondary" style="padding: 0.25rem 0.75rem; font-size: 0.75rem;">Logout</a>
            {{else}}
                <a href="/login">Login</a>
                <a href="/register" class="btn btn-primary">Register</a>
            {{end}}
        </div>
    </nav>
    <main>
        {{template "content" .}}
    </main>
    <footer>
        <p>Built for Dogfood 2026 · Tribunal Judging Platform</p>
    </footer>
</body>
</html>
{{end}}
