openapi: 3.0.3
info:
  title: Tribunal API
  description: API for the Tribunal Hackathon Platform (Dogfood 2026).
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session

paths:
  /api/judge/scores:
    get:
      summary: Get Judge Scores
      description: Returns a list of all scores submitted by the authenticated judge. Judges cannot see other judges' scores.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: A JSON array of scores
          content:
            application/json:
              schema:
                type: object
                properties:
                  scores:
                    type: array
                    items:
                      type: object
                      properties:
                        project_id:
                          type: string
                          format: uuid
                        criteria:
                          type: string
                          description: JSON string containing rubric data
                        comment:
                          type: string
        '403':
          description: Forbidden (Role isolation violation)

  /api/export.csv:
    get:
      summary: Export Data
      description: Returns a denormalized CSV of all projects, teams, and scores for offline analysis.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: CSV file contents
          content:
            text/csv:
              schema:
                type: string
        '403':
          description: Forbidden (Requires Organizer role)

  /api/export/bundle:
    get:
      summary: Export T4 Signed Results Bundle
      description: Generates a ZIP file containing results.json, audit-anchor.json, and a signed manifest.json for offline verification.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Signed results bundle ZIP
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '403':
          description: Forbidden (Requires Organizer role)

  /api/export/lossless:
    get:
      summary: Export Lossless SQLite DB
      description: Downloads the full dogfood.sqlite database for offline lossless backups.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: SQLite database file
          content:
            application/vnd.sqlite3:
              schema:
                type: string
                format: binary
        '403':
          description: Forbidden (Requires Organizer role)

  /api/import/lossless:
    post:
      summary: Import Lossless SQLite DB
      description: Uploads a dogfood.sqlite file, replacing the active database and triggering a server restart to load the new state.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                database:
                  type: string
                  format: binary
              required:
                - database
      responses:
        '200':
          description: Import applied. Server restarting.
        '403':
          description: Forbidden (Requires Organizer role)

  /api/assignments:
    get:
      summary: Get Judge Assignments
      description: Returns project assignments for the authenticated judge.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: JSON array of assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    project_id:
                      type: string
                    status:
                      type: string

  /api/audit:
    get:
      summary: Fetch Audit Log
      description: Returns cryptographic audit logs.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: JSON array of audit logs

  /api/judging/progress:
    get:
      summary: Judging Progress
      description: Returns current judging progress metrics.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: JSON object with progress stats

  /judge/pairwise:
    post:
      summary: Submit Pairwise Comparison
      description: Submits a Bradley-Terry winner/loser comparison.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                winner_id:
                  type: string
                  format: uuid
                loser_id:
                  type: string
                  format: uuid
              required:
                - winner_id
                - loser_id
      responses:
        '303':
          description: Redirects back to the next pairwise comparison

  /projects/new:
    post:
      summary: Submit Project
      description: Creates a new project submission. Enforces event deadlines.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                title:
                  type: string
                summary:
                  type: string
                repo_url:
                  type: string
                  format: uri
                track_id:
                  type: string
              required:
                - title
                - summary
                - track_id
      responses:
        '303':
          description: Redirects to dashboard
        '400':
          description: Bad Request (Event is closed for submissions)

  /api/webhooks:
    post:
      summary: Deliver Webhook
      description: Simulation endpoint for delivering events (e.g., project submission).
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Webhook delivered successfully
        '403':
          description: Forbidden (Requires Organizer role)

  /api/certificate:
    get:
      summary: Generate Certificate
      description: Generates a signed JSON certificate of participation and ranking.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Signed JSON certificate
        '401':
          description: Unauthorized

  /api/import:
    post:
      summary: Bulk Import
      description: Queues a bulk import of projects and users using the fixtures.json format.
      security:
        - sessionCookie: []
      responses:
        '202':
          description: Import queued successfully
        '403':
          description: Forbidden (Requires Organizer role)

  /embed/gallery:
    get:
      summary: Embeddable Gallery
      description: Returns an HTML fragment of the project gallery suitable for an iframe.
      responses:
        '200':
          description: HTML fragment
          content:
            text/html:
              schema:
                type: string

  /api/projects/{id}/vote:
    post:
      summary: Public Vote for Project
      description: Submits a public vote for a project. Supports configurable voting access modes (authenticated, email-gated, open-link). Includes rate-limiting and duplicate detection.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: Optional email for email-gated voting mode.
      responses:
        '200':
          description: Vote recorded
        '409':
          description: Conflict (Duplicate vote)

  /api/projects/{id}/comment:
    post:
      summary: Add Comment
      description: Adds a comment to a project.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
      responses:
        '200':
          description: Comment added

  /api/projects/{id}:
    put:
      summary: Update Project
      description: Fully updates project details. Restricted to project owners or organizers.
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                summary:
                  type: string
                repo_url:
                  type: string
                  format: uri
      responses:
        '200':
          description: Project updated
        '403':
          description: Forbidden
    delete:
      summary: Delete Project
      description: Deletes a project. Restricted to project owners or organizers.
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Project deleted
        '403':
          description: Forbidden

  /results:
    get:
      summary: Public Results
      description: Returns the public leaderboard if the configurable voting close time has passed.
      responses:
        '200':
          description: Leaderboard results
        '403':
          description: Forbidden (Results hidden until close time)
